[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionvault"
version = "0.1.0"
description = "Outcome-aware shared decision memory for agent teams"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/yfj898/decisionvault"
Homepage = "https://mfcr7b2k3j7lrwr44u35i5rchq0fbncb.lambda-url.ap-northeast-1.on.aws/"

[project.optional-dependencies]
dev = ["pytest>=8"]
cloud = ["psycopg[binary]>=3.2", "boto3>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
