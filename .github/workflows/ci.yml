name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync frozen development environment
        run: uv sync --frozen --extra dev

      - name: Run deterministic test suite
        run: uv run --frozen pytest -q

      - name: Check patch whitespace
        run: git diff --check

      - name: Scan tracked credential shapes
        run: uv run --frozen python scripts/ci_credential_shape_scan.py
